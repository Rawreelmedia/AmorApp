<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Amor Medical">
<meta name="theme-color" content="#0B1120">
<meta name="description" content="Amor Medical Platform — EMR, Calculators, Command Center">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>Amor Medical Platform</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0B1120;--card:#111827;--input:#1F2937;--hover:#1a2332;--primary:#0EA5E9;--accent:#10B981;--danger:#EF4444;--warn:#F59E0B;--purple:#8B5CF6;--border:#1F2937;--text:#F1F5F9;--muted:#94A3B8;--dim:#64748B;}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);height:100vh;height:100dvh;overflow:hidden;-webkit-font-smoothing:antialiased;}
button{cursor:pointer;font-family:inherit;}
input,select,textarea{font-family:inherit;background:var(--input);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:8px 12px;font-size:14px;outline:none;width:100%;}
input:focus,select:focus,textarea:focus{border-color:var(--primary);}
textarea{resize:vertical;min-height:60px;}

/* APP SHELL */
.shell{display:flex;flex-direction:column;height:100vh;height:100dvh;}

/* TOP NAV */
.top-nav{display:flex;align-items:center;padding:0 16px;height:52px;background:var(--card);border-bottom:1px solid var(--border);flex-shrink:0;gap:8px;}
.top-nav .logo{font-size:18px;font-weight:800;color:var(--primary);white-space:nowrap;}
.top-nav .spacer{flex:1;}
.install-btn{background:var(--primary);color:#fff;border:none;padding:6px 12px;border-radius:6px;font-size:11px;font-weight:600;display:none;width:auto;}
.nav-btn{background:var(--input);color:var(--text);border:1px solid var(--border);padding:6px 10px;border-radius:6px;font-size:14px;transition:all .15s;}
.nav-btn:hover{background:var(--hover);border-color:var(--primary);}
.refresh-btn{background:var(--accent);color:#fff;border:none;padding:6px 12px;border-radius:6px;font-size:11px;font-weight:600;}
.refresh-btn:hover{opacity:.9;}

/* UPDATE BANNER */
.update-banner{position:fixed;top:0;left:0;right:0;background:linear-gradient(90deg,var(--primary),var(--accent));color:#fff;padding:10px 16px;font-size:13px;font-weight:600;display:none;z-index:1000;text-align:center;cursor:pointer;animation:pulse 2s infinite;}
.update-banner.show{display:flex;align-items:center;justify-content:center;gap:10px;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.85;}}

/* SETTINGS MODAL */
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.7);display:none;z-index:2000;align-items:center;justify-content:center;padding:20px;}
.modal-overlay.show{display:flex;}
.modal{background:var(--card);border:1px solid var(--border);border-radius:12px;width:100%;max-width:360px;max-height:80vh;overflow-y:auto;}
.modal-header{display:flex;align-items:center;justify-content:space-between;padding:16px;border-bottom:1px solid var(--border);}
.modal-header h2{font-size:16px;margin:0;}
.modal-close{background:none;border:none;color:var(--muted);font-size:20px;padding:4px 8px;}
.modal-close:hover{color:var(--text);}
.modal-body{padding:16px;}
.settings-item{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--border);}
.settings-item:last-child{border-bottom:none;}
.settings-label{font-size:13px;color:var(--muted);}
.settings-value{font-size:13px;font-weight:600;color:var(--text);}
.settings-btn{background:var(--input);border:1px solid var(--border);color:var(--text);padding:8px 14px;border-radius:6px;font-size:12px;font-weight:600;width:100%;margin-top:8px;transition:all .15s;}
.settings-btn:hover{border-color:var(--primary);background:var(--hover);}
.settings-btn.danger{border-color:var(--danger);color:var(--danger);}
.settings-btn.danger:hover{background:var(--danger);color:#fff;}
.settings-btn.primary{background:var(--primary);border-color:var(--primary);color:#fff;}
.settings-btn.primary:hover{opacity:.9;}

/* MODULE TABS */
.module-tabs{display:flex;background:var(--card);border-bottom:1px solid var(--border);flex-shrink:0;overflow-x:auto;}
.module-tab{padding:10px 16px;color:var(--muted);cursor:pointer;font-size:12px;font-weight:600;border-bottom:2px solid transparent;white-space:nowrap;transition:all .15s;text-align:center;flex:1;min-width:0;}
.module-tab:hover{color:var(--text);}
.module-tab.active{color:var(--primary);border-bottom-color:var(--primary);}
.module-tab .tab-icon{font-size:16px;display:block;margin-bottom:2px;}

/* CONTENT */
.module-content{flex:1;overflow:hidden;position:relative;}
.module-frame{position:absolute;top:0;left:0;width:100%;height:100%;border:none;display:none;}
.module-frame.active{display:block;}

/* FALLBACK CONTENT (when iframes aren't used) */
.inline-content{position:absolute;top:0;left:0;width:100%;height:100%;overflow-y:auto;padding:20px;display:none;}
.inline-content.active{display:block;}

/* CARDS */
.sg{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:16px;}
.sc{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px;}
.sc .sl{font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.5px;}
.sc .sv{font-size:22px;font-weight:800;}
.sc.blue .sv{color:var(--primary);}
.sc.green .sv{color:var(--accent);}
.sc.yellow .sv{color:var(--warn);}
.sc.red .sv{color:var(--danger);}

.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:8px;font-size:12px;font-weight:600;border:none;width:auto;transition:all .15s;}
.btn-p{background:var(--primary);color:#fff;}
.btn-g{background:transparent;color:var(--muted);border:1px solid var(--border);}
.btn-a{background:var(--accent);color:#fff;}
.badge{display:inline-block;padding:2px 8px;border-radius:12px;font-size:10px;font-weight:600;}
.bg{background:rgba(16,185,129,.15);color:var(--accent);}
.by{background:rgba(245,158,11,.15);color:var(--warn);}
.br{background:rgba(239,68,68,.15);color:var(--danger);}
.bb{background:rgba(14,165,233,.15);color:var(--primary);}

.stitle{font-size:14px;font-weight:700;margin:16px 0 8px;padding-bottom:6px;border-bottom:1px solid var(--border);}

.link-card{display:flex;align-items:center;gap:10px;padding:10px;background:var(--input);border:1px solid var(--border);border-radius:8px;margin-bottom:6px;text-decoration:none;color:var(--text);font-size:12px;}
.link-card:hover{border-color:var(--primary);}

.progress-row{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--border);font-size:12px;}
.progress-row .pr-name{flex:1;}
.progress-row .pr-bar{width:80px;height:6px;background:var(--input);border-radius:3px;overflow:hidden;}
.progress-row .pr-fill{height:100%;border-radius:3px;}
.progress-row .pr-pct{width:32px;text-align:right;font-weight:700;font-size:11px;}
</style>
</head>
<body>
<div class="shell">
  <!-- UPDATE BANNER -->
  <div class="update-banner" id="updateBanner" onclick="refreshApp()">
    <span>🎉 Update available!</span>
    <span style="background:rgba(255,255,255,.2);padding:4px 10px;border-radius:4px;">Tap to refresh</span>
  </div>

  <!-- SETTINGS MODAL -->
  <div class="modal-overlay" id="settingsModal" onclick="if(event.target===this)closeSettings()">
    <div class="modal">
      <div class="modal-header">
        <h2>⚙️ Settings</h2>
        <button class="modal-close" onclick="closeSettings()">✕</button>
      </div>
      <div class="modal-body">
        <div class="settings-item">
          <span class="settings-label">App Version</span>
          <span class="settings-value" id="appVersionDisplay">v1.0.2</span>
        </div>
        <div class="settings-item">
          <span class="settings-label">Server Version</span>
          <span class="settings-value" id="serverVersionDisplay">Checking...</span>
        </div>
        <div class="settings-item">
          <span class="settings-label">Last Updated</span>
          <span class="settings-value" id="lastUpdated">-</span>
        </div>
        
        <div style="margin-top:16px;">
          <button class="settings-btn primary" onclick="checkForUpdates()">🔍 Check for Updates</button>
          <button class="settings-btn" onclick="refreshApp()">🔄 Clear Cache & Reload</button>
          <button class="settings-btn danger" onclick="hardReset()">🗑️ Full Reset (Nuclear)</button>
        </div>
        
        <div style="margin-top:20px;padding-top:16px;border-top:1px solid var(--border);text-align:center;">
          <p style="font-size:11px;color:var(--dim);margin:0;">Amor Medical Platform</p>
          <p style="font-size:10px;color:var(--dim);margin:4px 0 0;">Built with 💙 by Emily & Ashley</p>
        </div>
      </div>
    </div>
  </div>

  <!-- TOP -->
  <div class="top-nav">
    <div class="logo">💙 Amor Medical</div>
    <div class="spacer"></div>
    <button class="refresh-btn" onclick="refreshApp()" title="Refresh App">🔄</button>
    <a href="user-guide.html" class="nav-btn" title="Help & User Guide" style="text-decoration:none;">📚</a>
    <button class="nav-btn" onclick="openSettings()" title="Settings">⚙️</button>
    <button class="install-btn" id="installBtn" onclick="installPWA()">📲 Install App</button>
  </div>

  <!-- MODULE TABS -->
  <div class="module-tabs" id="moduleTabs">
    <div class="module-tab active" onclick="switchModule('home')"><span class="tab-icon">🏠</span>Home</div>
    <div class="module-tab" onclick="switchModule('emr')"><span class="tab-icon">🏥</span>EMR</div>
    <div class="module-tab" onclick="switchModule('calc')"><span class="tab-icon">🧮</span>Calc</div>
    <div class="module-tab" onclick="switchModule('cmd')"><span class="tab-icon">📋</span>Command</div>
    <div class="module-tab" onclick="switchModule('learn')"><span class="tab-icon">📚</span>Learn</div>
    <div class="module-tab" onclick="window.location.href='user-guide.html'"><span class="tab-icon">❓</span>Help</div>
  </div>

  <!-- CONTENT -->
  <div class="module-content" id="moduleContent">
    <!-- HOME -->
    <div class="inline-content active" id="mod-home"></div>
    <!-- EMR (iframe) -->
    <iframe class="module-frame" id="mod-emr" src="" data-src="amor-medical-emr.html"></iframe>
    <!-- CALCULATOR (iframe) -->
    <iframe class="module-frame" id="mod-calc" src="" data-src="amor-medical-calculator.html"></iframe>
    <!-- COMMAND CENTER (iframe) -->
    <iframe class="module-frame" id="mod-cmd" src="" data-src="command-center.html"></iframe>
    <!-- LEARN -->
    <div class="inline-content" id="mod-learn"></div>
  </div>
</div>

<script>
// ============================================
// VERSION & UPDATE SYSTEM
// ============================================
const APP_VERSION = '3.0.0';
let serverVersion = null;

// Display current version
document.getElementById('appVersionDisplay').textContent = 'v' + APP_VERSION;

// Check for updates on load
window.addEventListener('load', () => {
  checkForUpdates(true); // Silent check on load
  updateLastUpdatedTime();
});

// Check server version
async function checkForUpdates(silent = false) {
  const serverDisplay = document.getElementById('serverVersionDisplay');
  serverDisplay.textContent = 'Checking...';
  
  try {
    // Add cache-buster to always get fresh version.json
    const response = await fetch('version.json?t=' + Date.now());
    const data = await response.json();
    serverVersion = data.version;
    serverDisplay.textContent = 'v' + serverVersion;
    
    // Compare versions
    if (isNewerVersion(serverVersion, APP_VERSION)) {
      showUpdateBanner();
      if (!silent) {
        alert('🎉 New version available: v' + serverVersion + '\n\nCurrent: v' + APP_VERSION + '\n\nTap "Clear Cache & Reload" to update!');
      }
    } else if (!silent) {
      alert('✅ You have the latest version!\n\nv' + APP_VERSION);
    }
  } catch (err) {
    serverDisplay.textContent = 'Offline';
    if (!silent) {
      alert('⚠️ Could not check for updates.\nYou may be offline.');
    }
  }
}

// Compare version strings (e.g., "1.0.3" > "1.0.2")
function isNewerVersion(server, local) {
  const s = server.split('.').map(Number);
  const l = local.split('.').map(Number);
  for (let i = 0; i < Math.max(s.length, l.length); i++) {
    const sv = s[i] || 0;
    const lv = l[i] || 0;
    if (sv > lv) return true;
    if (sv < lv) return false;
  }
  return false;
}

// Show update banner
function showUpdateBanner() {
  document.getElementById('updateBanner').classList.add('show');
}

// Update last updated time display
function updateLastUpdatedTime() {
  const lastUpdate = localStorage.getItem('amorAppLastUpdate');
  const el = document.getElementById('lastUpdated');
  if (lastUpdate) {
    const date = new Date(parseInt(lastUpdate));
    el.textContent = date.toLocaleDateString() + ' ' + date.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
  } else {
    el.textContent = 'Never';
  }
}

// ============================================
// CACHE & REFRESH FUNCTIONS
// ============================================

// Refresh app - clear caches, unregister SW, reload
async function refreshApp() {
  const banner = document.getElementById('updateBanner');
  banner.innerHTML = '<span>⏳ Refreshing...</span>';
  
  try {
    // 1. Clear all caches
    if ('caches' in window) {
      const cacheNames = await caches.keys();
      await Promise.all(cacheNames.map(name => {
        console.log('[App] Deleting cache:', name);
        return caches.delete(name);
      }));
      console.log('[App] All caches cleared');
    }
    
    // 2. Unregister service worker
    if ('serviceWorker' in navigator) {
      const registrations = await navigator.serviceWorker.getRegistrations();
      await Promise.all(registrations.map(reg => {
        console.log('[App] Unregistering SW');
        return reg.unregister();
      }));
      console.log('[App] Service workers unregistered');
    }
    
    // 3. Record update time
    localStorage.setItem('amorAppLastUpdate', Date.now().toString());
    
    // 4. Force reload from server
    window.location.reload(true);
    
  } catch (err) {
    console.error('[App] Refresh error:', err);
    // Try reload anyway
    window.location.reload(true);
  }
}

// Nuclear option - full reset
async function hardReset() {
  if (!confirm('🗑️ FULL RESET\n\nThis will:\n• Clear ALL cached data\n• Unregister service worker\n• Clear localStorage\n• Force reload\n\nContinue?')) {
    return;
  }
  
  try {
    // Clear caches
    if ('caches' in window) {
      const cacheNames = await caches.keys();
      await Promise.all(cacheNames.map(name => caches.delete(name)));
    }
    
    // Unregister service workers
    if ('serviceWorker' in navigator) {
      const registrations = await navigator.serviceWorker.getRegistrations();
      await Promise.all(registrations.map(reg => reg.unregister()));
    }
    
    // Clear localStorage (except important stuff)
    localStorage.clear();
    localStorage.setItem('amorAppLastUpdate', Date.now().toString());
    
    // Clear sessionStorage
    sessionStorage.clear();
    
    alert('✅ Full reset complete!\n\nReloading app...');
    window.location.href = window.location.pathname + '?reset=' + Date.now();
    
  } catch (err) {
    console.error('[App] Hard reset error:', err);
    window.location.reload(true);
  }
}

// ============================================
// SETTINGS MODAL
// ============================================
function openSettings() {
  document.getElementById('settingsModal').classList.add('show');
  checkForUpdates(true); // Refresh server version when opening
}

function closeSettings() {
  document.getElementById('settingsModal').classList.remove('show');
}

// Close modal on Escape key
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeSettings();
});

// ============================================
// PWA INSTALL
// ============================================
let deferredPrompt;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;document.getElementById('installBtn').style.display='block';});
function installPWA(){if(deferredPrompt){deferredPrompt.prompt();deferredPrompt.userChoice.then(r=>{if(r.outcome==='accepted')document.getElementById('installBtn').style.display='none';deferredPrompt=null;});}}

// ============================================
// SERVICE WORKER
// ============================================
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js')
    .then(reg => {
      console.log('[App] SW registered');
      
      // Listen for updates
      reg.addEventListener('updatefound', () => {
        const newWorker = reg.installing;
        newWorker.addEventListener('statechange', () => {
          if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
            // New version available
            console.log('[App] New SW version available');
            showUpdateBanner();
          }
        });
      });
    })
    .catch(err => console.log('[App] SW registration failed:', err));
  
  // Listen for controller changes (new SW took over)
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    console.log('[App] New SW controller, reloading...');
  });
}

// Module switching
let currentModule='home';
const loaded={};

function switchModule(mod){
  currentModule=mod;
  // Update tabs
  document.querySelectorAll('.module-tab').forEach((t,i)=>{
    const mods=['home','emr','calc','cmd','learn'];
    t.classList.toggle('active',mods[i]===mod);
  });
  // Hide all
  document.querySelectorAll('.module-frame,.inline-content').forEach(el=>{
    el.classList.remove('active');
    if(el.tagName==='IFRAME') el.style.display='none';
    else el.style.display='none';
  });
  // Show target
  const el=document.getElementById('mod-'+mod);
  if(el.tagName==='IFRAME'){
    if(!loaded[mod]&&el.dataset.src){el.src=el.dataset.src;loaded[mod]=true;}
    el.style.display='block';el.classList.add('active');
  } else {
    el.style.display='block';el.classList.add('active');
    if(mod==='home') renderHome();
    if(mod==='learn') renderLearn();
  }
}

// HOME

  document.getElementById('mod-home').innerHTML=`
    <div style="text-align:center;padding:20px 0 10px;">
      <div style="font-size:32px;">💙</div>
      <h1 style="font-size:20px;margin:8px 0;">Amor Medical Platform</h1>
      <p style="color:var(--muted);font-size:13px;">EMR · Calculators · Command Center</p>
    </div>

    <div class="sg">
      <div class="sc blue"><div class="sl">EMR Version</div><div class="sv">2.1</div></div>
      <div class="sc green"><div class="sl">Calculators</div><div class="sv">20/40</div></div>
      <div class="sc yellow"><div class="sl">Projects</div><div class="sv">7</div></div>
      <div class="sc red"><div class="sl">Blockers</div><div class="sv">3</div></div>
    </div>

    <div class="stitle">📊 Project Progress</div>
    <div class="progress-row"><span class="pr-name">🏥 EMR Platform</span><div class="pr-bar"><div class="pr-fill" style="width:45%;background:var(--primary);"></div></div><span class="pr-pct">45%</span></div>
    <div class="progress-row"><span class="pr-name">🧮 Calculators</span><div class="pr-bar"><div class="pr-fill" style="width:50%;background:var(--accent);"></div></div><span class="pr-pct">50%</span></div>
    <div class="progress-row"><span class="pr-name">🏋️ KRU Deploy</span><div class="pr-bar"><div class="pr-fill" style="width:86%;background:var(--accent);"></div></div><span class="pr-pct">86%</span></div>
    <div class="progress-row"><span class="pr-name">🦉 OWL / Bobo AI</span><div class="pr-bar"><div class="pr-fill" style="width:60%;background:var(--warn);"></div></div><span class="pr-pct">60%</span></div>
    <div class="progress-row"><span class="pr-name">🔥 Sales Resources</span><div class="pr-bar"><div class="pr-fill" style="width:0%;background:var(--danger);"></div></div><span class="pr-pct">0%</span></div>

    <div class="stitle">⚡ Quick Launch</div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
      <button class="btn btn-p" onclick="switchModule('emr')" style="justify-content:center;">🏥 Open EMR</button>
      <button class="btn btn-a" onclick="switchModule('calc')" style="justify-content:center;">🧮 Calculators</button>
      <button class="btn btn-g" onclick="switchModule('cmd')" style="justify-content:center;">📋 Command Center</button>
      <button class="btn btn-g" onclick="switchModule('learn')" style="justify-content:center;">📚 Learn</button>
    </div>

    <div class="stitle">🔗 External Links</div>
    <a class="link-card" href="https://docs.google.com/spreadsheets/d/1LDSTvUH3tRcm2a0LjM86nSnDZ-7EkLaL7ePrULngLbE/edit" target="_blank">📊 Master Command Center (Google Sheets)</a>
    <a class="link-card" href="https://docs.google.com/spreadsheets/d/1KO35f08pDJwd-70YwqdeXdxgSi1b5ki8cKzkPbeU0Z0/edit" target="_blank">🏋️ KRU Executive Sheet</a>
    <a class="link-card" href="https://app.ricocloud.net" target="_blank">☁️ Rico Cloud Platform</a>

    <div class="stitle">🤖 Agent Team</div>
    <div style="font-size:12px;color:var(--muted);line-height:2;">
      <div>🌿 <strong>Emily</strong> — Personal Assistant (Agent 1)</div>
      <div>💜 <strong>Ashley</strong> — Development (Agent 2)</div>
      <div>🪓 <strong>Axe</strong> — Marketing / RRM (Agent 3)</div>
    </div>

    <div style="text-align:center;padding:20px 0;font-size:11px;color:var(--dim);">
      Amor Medical Platform v${APP_VERSION} · Built by Emily 🌿 + Ashley 💜<br>
      © 2026 Dr. Roger Gonzalez · Rico Solutions<br>
      <button onclick="openSettings()" style="background:none;border:none;color:var(--primary);font-size:11px;margin-top:6px;cursor:pointer;">⚙️ Settings & Updates</button>
    </div>
  `;
}

// LEARN
function renderLearn(){
  const sections=[
    {title:'🏥 EMR Development',links:[
      {t:'How to Build an EHR from Scratch',u:'https://www.youtube.com/watch?v=bDnB0vGkOFY',d:'EMR architecture & FHIR standards'},
      {t:'FHIR for Developers — HL7 Intro',u:'https://www.youtube.com/watch?v=Oe421EPjeBE',d:'Healthcare data interoperability'},
      {t:'What is HIPAA? Compliance Explained',u:'https://www.youtube.com/watch?v=WnBqBnQ0bTk',d:'Every healthcare app needs this'},
      {t:'OpenEMR — Open Source EMR Demo',u:'https://www.youtube.com/watch?v=nu_pCVPKzTk',d:'Reference architecture'},
