  const pat=db.patients.find(p=>p.id===document.getElementById('neP').value);
  const e={id:genId(),patientId:document.getElementById('neP').value,providerId:document.getElementById('nePv').value,practiceId:pat?pat.practiceId:db.practices[0].id,date:document.getElementById('neD').value,type:document.getElementById('neT').value,noteType:document.getElementById('neNT').value,chiefComplaint:document.getElementById('neCC').value,subjective:document.getElementById('neS').value,objective:document.getElementById('neO').value,assessment:document.getElementById('neA').value,plan:document.getElementById('nePl').value,vitals:{bp:document.getElementById('neBP').value,hr:document.getElementById('neHR').value,temp:document.getElementById('neTp').value,spo2:document.getElementById('neO2').value,weight:document.getElementById('neWt').value,height:document.getElementById('neHt').value},icd10:document.getElementById('neICD').value,cpt:document.getElementById('neCPT').value,status:status,signedAt:status==='signed'?new Date().toISOString():null};

}

    const pv=db.providers.find(x=>x.id===rx.providerId);
    const medInfo=rxMedications.find(m=>m.generic===rx.medication||m.brand.includes(rx.medication));

    const dawBadge=rx.daw?`<span class="badge badge-purple" style="margin-left:4px;">DAW</span>`:'';

function filterRxList(){
  const q=(document.getElementById('rxSearchInput').value||'').toLowerCase();
  const status=document.getElementById('rxStatusFilter').value;
  let filtered=db.prescriptions;
  if(status!=='all') filtered=filtered.filter(rx=>rx.status===status);
  if(q){
    filtered=filtered.filter(rx=>{
      const p=db.patients.find(x=>x.id===rx.patientId);
      const pName=p?(p.firstName+' '+p.lastName).toLowerCase():'';
      return rx.medication.toLowerCase().includes(q)||pName.includes(q)||
             (rx.sig||'').toLowerCase().includes(q);
    });
  }
  document.getElementById('rxListContainer').innerHTML=renderRxList(filtered);
}

// Medication search with brand/generic display
function searchMedications(q){
  const results=document.getElementById('medSearchResults');
  if(q.length<2){results.style.display='none';return;}
  
  const matches=rxMedications.filter(m=>
    m.generic.toLowerCase().includes(q.toLowerCase())||
    m.brand.toLowerCase().includes(q.toLowerCase())||
    m.class.toLowerCase().includes(q.toLowerCase())
  ).slice(0,15);
  
  if(!matches.length){
    results.innerHTML='<div style="padding:8px;color:var(--text-dim);">No medications found</div>';
  } else {
    results.innerHTML=matches.map(m=>{
      const schedBadge=m.schedule?`<span class="badge badge-red">${m.schedule}</span>`:'';
      return `<div onclick="selectMedication('${m.generic}')" style="padding:10px;border-bottom:1px solid var(--border);cursor:pointer;display:flex;justify-content:space-between;align-items:center;" onmouseover="this.style.background='var(--bg-hover)'" onmouseout="this.style.background=''">
        <div>
          <div style="font-weight:600;">${m.generic} ${schedBadge}</div>
          <div style="font-size:11px;color:var(--text-dim);">Brand: ${m.brand} | Class: ${m.class}</div>
        </div>
      </div>`;
    }).join('');
  }
  results.style.display='block';
}

function selectMedication(name){
  const med=rxMedications.find(m=>m.generic===name);
  if(!med) return;
  
  document.getElementById('rxMedSearch').value=`${med.generic} (${med.brand})`;
  document.getElementById('rxMedSelected').value=med.generic;
  document.getElementById('medSearchResults').style.display='none';
  
  // Show selected med info
  const info=document.getElementById('selectedMedInfo');
  info.style.display='block';

    <div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;">
      <div><strong>${med.generic}</strong> <span style="color:var(--text-dim);">(${med.brand})</span></div>
      <div><span class="badge badge-blue">${med.class}</span> ${med.schedule?`<span class="badge badge-red">${med.schedule}</span>`:''}</div>

  `;

  // Set route
  document.getElementById('rxRoute').value=med.routes[0]||'Oral';
  
  // Check drug interactions
  checkDrugInteractions(med);
  
  // Build sig preview
  buildSigPreview();
}

function checkDrugInteractions(newMed){
  const patId=document.getElementById('rxPatient').value;
  const currentMeds=db.prescriptions.filter(rx=>rx.patientId===patId&&rx.status==='active');
  const patientAllergies=db.patients.find(p=>p.id===patId)?.allergies||[];
  
  const warnings=[];
  
  // Check against current medications
  currentMeds.forEach(rx=>{
    const existingMed=rxMedications.find(m=>m.generic===rx.medication);
    if(existingMed&&newMed.interactions){
      newMed.interactions.forEach(int=>{
        if(existingMed.generic.toLowerCase().includes(int.toLowerCase())||
           existingMed.class.toLowerCase().includes(int.toLowerCase())){
          warnings.push(`<strong>${newMed.generic}</strong> may interact with <strong>${existingMed.generic}</strong> (current med)`);
        }
      });
    }
    // Check reverse
    if(existingMed&&existingMed.interactions){
      existingMed.interactions.forEach(int=>{
        if(newMed.generic.toLowerCase().includes(int.toLowerCase())||
           newMed.class.toLowerCase().includes(int.toLowerCase())){
          warnings.push(`<strong>${existingMed.generic}</strong> (current) may interact with <strong>${newMed.generic}</strong>`);
        }
      });
    }
  });
  
  // Check against allergies
  patientAllergies.forEach(allergy=>{
    const allergyLower=allergy.toLowerCase();
    if(newMed.generic.toLowerCase().includes(allergyLower)||
       newMed.brand.toLowerCase().includes(allergyLower)||
       newMed.class.toLowerCase().includes(allergyLower)||
       (allergyLower.includes('penicillin')&&newMed.class.includes('Penicillin'))||
       (allergyLower.includes('sulfa')&&newMed.class.includes('Sulfonamide'))){
      warnings.push(`<strong>⚠️ ALLERGY ALERT:</strong> Patient allergic to <strong>${allergy}</strong>`);
    }
  });
  
  const warningDiv=document.getElementById('drugInteractionWarning');
  if(warnings.length){
    document.getElementById('interactionList').innerHTML=warnings.map(w=>`<div style="margin-top:4px;">• ${w}</div>`).join('');
    warningDiv.style.display='block';
  } else {
    warningDiv.style.display='none';
  }
}

function buildSigPreview(){
  const dose=document.getElementById('rxDose').value;
  const route=document.getElementById('rxRoute').value;
  const freq=document.getElementById('rxFreq').value;
  
  if(!dose||dose==='Select med first') return;
  
  const freqText={
    'QD':'once daily','BID':'twice daily','TID':'three times daily','QID':'four times daily',
    'Q4H':'every 4 hours','Q6H':'every 6 hours','Q8H':'every 8 hours','Q12H':'every 12 hours',
    'QHS':'at bedtime','QAM':'every morning','QPM':'every evening','PRN':'as needed',
    'BID PRN':'twice daily as needed','TID PRN':'three times daily as needed',
    'QWeek':'once weekly','Q2Weeks':'every 2 weeks','QMonth':'once monthly'
  };
  
  const routeText={
    'Oral':'by mouth','Sublingual':'under the tongue','Subcutaneous':'subcutaneously',
    'Intramuscular':'intramuscularly','IV':'intravenously','Inhalation':'by inhalation',
    'Topical':'topically','Transdermal':'via patch','Ophthalmic':'in affected eye(s)',
    'Otic':'in affected ear(s)','Nasal':'intranasally','Rectal':'rectally','Vaginal':'vaginally'
  };
  
  const sig=`Take ${dose} ${routeText[route]||route.toLowerCase()} ${freqText[freq]||freq}`;
  document.getElementById('rxSigPreview').value=sig;
}

function autoCalcQuantity(){
  const freq=document.getElementById('rxFreq').value;
  const duration=parseInt(document.getElementById('rxDuration').value)||30;
  
  const dosesPerDay={
    'QD':1,'BID':2,'TID':3,'QID':4,'Q4H':6,'Q6H':4,'Q8H':3,'Q12H':2,
    'QHS':1,'QAM':1,'QPM':1,'PRN':2,'BID PRN':2,'TID PRN':3,
    'QWeek':1/7,'Q2Weeks':1/14,'QMonth':1/30
  };
  
  const perDay=dosesPerDay[freq]||1;
  let qty=Math.ceil(perDay*duration);
  
  // Round to common quantities
  if(qty<=7) qty=7;
  else if(qty<=14) qty=14;
  else if(qty<=21) qty=21;
  else if(qty<=30) qty=30;
  else if(qty<=60) qty=60;
  else if(qty<=90) qty=90;
  else qty=Math.ceil(qty/30)*30;
  
  document.getElementById('rxQuantity').value=qty;
}

// Submit E-Prescribe
function submitEPrescribe(){
  const medName=document.getElementById('rxMedSelected').value;
  if(!medName){alert('Please select a medication');return;}
  
  const sig=document.getElementById('rxSigPreview').value;
  if(!sig){alert('Sig is required');return;}
  
  const pharmacy=document.getElementById('rxPharmacy').value;
  if(!pharmacy){alert('Please select a pharmacy');return;}
  
  const dose=document.getElementById('rxDose').value;
  const dm=dose.match(/^([\d.]+)\s*(\w+)$/);
  
  const med=rxMedications.find(m=>m.generic===medName);
  
  const rx={
    id:genId(),
    patientId:document.getElementById('rxPatient').value,
    providerId:document.getElementById('rxPrescriber').value,
    medication:medName,
    dose:dm?dm[1]:dose,
    unit:dm?dm[2]:'',
    route:document.getElementById('rxRoute').value,
    frequency:document.getElementById('rxFreq').value,
    duration:parseInt(document.getElementById('rxDuration').value)||30,
    quantity:parseInt(document.getElementById('rxQuantity').value)||30,
    refills:parseInt(document.getElementById('rxRefills').value)||0,
    refillsRemaining:parseInt(document.getElementById('rxRefills').value)||0,
    daw:document.getElementById('rxDAW').value!=='0',
    dawCode:document.getElementById('rxDAW').value,
    sig:sig,
    pharmacistNotes:document.getElementById('rxPharmacistNotes').value,
    patientNotes:document.getElementById('rxPatientNotes').value,
    officeNotes:document.getElementById('rxOfficeNotes').value,
    icd10:document.getElementById('rxICD10Selected').value,
    pharmacy:pharmacy.includes('|')?pharmacy.split('|')[0]:pharmacy,
    pharmacyFull:pharmacy,
    schedule:med?.schedule||null,
    status:'active',
    transmitStatus:'pending', // pending, sent, error
    writtenDate:new Date().toISOString().split('T')[0],
    createdAt:new Date().toISOString()
  };
  
  // Check if controlled substance
  if(rx.schedule){
    if(!confirm(`⚠️ This is a ${rx.schedule} controlled substance.\n\nEPCS (Electronic Prescribing of Controlled Substances) requires two-factor authentication.\n\nFor demo purposes, click OK to simulate EPCS authentication.`)){
      return;
    }
  }
  
  db.prescriptions.push(rx);
  saveDB();
  closeModal();
  render();
  
  // Show success message
  setTimeout(()=>{
    alert(`✅ E-Prescription submitted!\n\n${rx.medication} ${rx.dose}${rx.unit}\nSent to: ${rx.pharmacy}\n\n📤 In production, this would transmit via Surescripts.`);
  },200);
}

function openCalcHOMA(){showModal(`<button class="modal-close" onclick="closeModal()">✕</button><h3>HOMA-IR — Insulin Resistance</h3><div class="form-grid"><div class="form-group"><label>Fasting Insulin (µU/mL)</label><input type="number" step="0.1" id="homaI"></div><div class="form-group"><label>Fasting Glucose (mg/dL)</label><input type="number" id="homaG"></div></div><div class="form-actions"><button class="btn btn-primary" onclick="calcHOMA()">Calculate</button></div><div id="homaR"></div>`);}
function calcHOMA(){const i=+document.getElementById('homaI').value,g=+document.getElementById('homaG').value;if(!i||!g)return;const h=(i*g/405).toFixed(2);let s='Normal (insulin sensitive)',cl='var(--accent)';if(h>=2.5){s='Insulin Resistant';cl='var(--danger)';}else if(h>=1.9){s='Early insulin resistance';cl='var(--warning)';}document.getElementById('homaR').innerHTML=`<div class="vital-box" style="text-align:center;margin-top:12px;"><div class="vital-label">HOMA-IR</div><div class="vital-value" style="color:${cl};font-size:32px;">${h}</div><div style="font-size:14px;font-weight:600;color:${cl};">${s}</div><div style="font-size:11px;color:var(--text-dim);">Normal <1.0 | Cutoff ≥2.5</div></div>`;}

function openCalcBW(){showModal(`<button class="modal-close" onclick="closeModal()">✕</button><h3>Burch-Wartofsky Point Scale — Thyroid Storm</h3>
  <div class="form-group" style="margin-bottom:8px;"><label>Temperature</label><select id="bwT"><option value="0">99-99.9°F</option><option value="5">100-100.9°F</option><option value="10">101-101.9°F</option><option value="15">102-102.9°F</option><option value="20">103-103.9°F</option><option value="25">≥104°F</option></select></div>
  <div class="form-group" style="margin-bottom:8px;"><label>Heart Rate</label><select id="bwHR"><option value="0"><90</option><option value="5">90-109</option><option value="10">110-119</option><option value="15">120-129</option><option value="20">130-139</option><option value="25">≥140</option></select></div>
  <div class="form-group" style="margin-bottom:8px;"><label>CNS Effects</label><select id="bwCNS"><option value="0">Absent</option><option value="10">Mild (agitation)</option><option value="20">Moderate (delirium, psychosis)</option><option value="30">Severe (seizure, coma)</option></select></div>
  <div class="form-group" style="margin-bottom:8px;"><label>GI-Hepatic</label><select id="bwGI"><option value="0">Absent</option><option value="10">Moderate (diarrhea, N/V, pain)</option><option value="20">Severe (jaundice)</option></select></div>

  <div class="form-actions"><button class="btn btn-primary" onclick="calcBW()">Calculate</button></div><div id="bwR"></div>`);}
function calcBW(){const t=+document.getElementById('bwT').value+Number(document.getElementById('bwHR').value)+Number(document.getElementById('bwCNS').value)+Number(document.getElementById('bwGI').value)+Number(document.getElementById('bwHF').value)+Number(document.getElementById('bwAF').value)+Number(document.getElementById('bwPE').value);let s,cl;if(t>=45){s='Highly suggestive of thyroid storm';cl='var(--danger)';}else if(t>=25){s='Impending thyroid storm';cl='var(--warning)';}else{s='Thyroid storm unlikely';cl='var(--accent)';}document.getElementById('bwR').innerHTML=`<div class="vital-box" style="text-align:center;margin-top:12px;"><div class="vital-label">Burch-Wartofsky Score</div><div class="vital-value" style="color:${cl};font-size:32px;">${t}</div><div style="font-size:14px;font-weight:600;color:${cl};">${s}</div><div style="font-size:11px;color:var(--text-dim);">&lt;25 unlikely | 25-44 impending | ≥45 storm</div></div>`;}

function openCalcCPep(){showModal(`<button class="modal-close" onclick="closeModal()">✕</button><h3>C-Peptide to Glucose Ratio</h3><div class="form-grid"><div class="form-group"><label>C-Peptide (ng/mL)</label><input type="number" step="0.01" id="cpC"></div><div class="form-group"><label>Blood Glucose (mg/dL)</label><input type="number" id="cpG"></div></div><div class="form-actions"><button class="btn btn-primary" onclick="calcCPep()">Calculate</button></div><div id="cpR"></div>`);}
function calcCPep(){const c=+document.getElementById('cpC').value,g=+document.getElementById('cpG').value;if(!c||!g)return;const r=(c/g).toFixed(4);let s='Normal beta cell function',cl='var(--accent)';if(r<0.01){s='Suggests exogenous insulin / low beta cell function';cl='var(--danger)';}document.getElementById('cpR').innerHTML=`<div class="vital-box" style="text-align:center;margin-top:12px;"><div class="vital-label">C-Peptide:Glucose Ratio</div><div class="vital-value" style="color:${cl};font-size:32px;">${r}</div><div style="font-size:14px;font-weight:600;color:${cl};">${s}</div></div>`;}

function openCalcNaCorr(){showModal(`<button class="modal-close" onclick="closeModal()">✕</button><h3>Sodium Correction for Hyperglycemia</h3><div class="form-grid"><div class="form-group"><label>Measured Na⁺ (mEq/L)</label><input type="number" id="ncNa"></div><div class="form-group"><label>Serum Glucose (mg/dL)</label><input type="number" id="ncGl"></div></div><div class="form-actions"><button class="btn btn-primary" onclick="calcNaCorr()">Calculate</button></div><div id="ncR"></div>`);}
function calcNaCorr(){const na=+document.getElementById('ncNa').value,gl=+document.getElementById('ncGl').value;if(!na||!gl)return;const corrNa=(na+1.6*((gl-100)/100)).toFixed(1);document.getElementById('ncR').innerHTML=`<div class="vital-box" style="text-align:center;margin-top:12px;"><div class="vital-label">Corrected Na⁺</div><div class="vital-value" style="color:var(--primary);font-size:32px;">${corrNa} mEq/L</div><div style="font-size:11px;color:var(--text-dim);">Katz correction: Na + 1.6 × ((Glucose-100)/100)</div></div>`;}

function openCalcSteroid(){showModal(`<button class="modal-close" onclick="closeModal()">✕</button><h3>Steroid Conversion Calculator</h3>
  <div class="form-grid"><div class="form-group"><label>From Steroid</label><select id="stFrom"><option value="1">Hydrocortisone (1x)</option><option value="4">Prednisone (4x)</option><option value="4">Prednisolone (4x)</option><option value="5">Methylprednisolone (5x)</option><option value="5">Triamcinolone (5x)</option><option value="25">Dexamethasone (25x)</option><option value="25">Betamethasone (25x)</option></select></div>

function calcSteroid(){const from=+document.getElementById('stFrom').value,to=+document.getElementById('stTo').value,dose=+document.getElementById('stDose').value;if(!dose)return;const hydro=dose/from*20;const result=(hydro*to/20).toFixed(2);document.getElementById('stR').innerHTML=`<div class="vital-box" style="text-align:center;margin-top:12px;"><div class="vital-label">Equivalent Dose</div><div class="vital-value" style="color:var(--primary);font-size:32px;">${result} mg</div><div style="font-size:11px;color:var(--text-dim);">Hydrocortisone equivalent: ${hydro.toFixed(1)} mg</div></div>`;}

function openCalcAnionGap(){showModal(`<button class="modal-close" onclick="closeModal()">✕</button><h3>Anion Gap</h3><div class="form-grid"><div class="form-group"><label>Na⁺ (mEq/L)</label><input type="number" id="agNa"></div><div class="form-group"><label>Cl⁻ (mEq/L)</label><input type="number" id="agCl"></div><div class="form-group"><label>HCO₃⁻ (mEq/L)</label><input type="number" id="agHco"></div><div class="form-group"><label>Albumin (g/dL, optional)</label><input type="number" step="0.1" id="agAlb" value="4.0"></div></div><div class="form-actions"><button class="btn btn-primary" onclick="calcAG()">Calculate</button></div><div id="agR"></div>`);}
function calcAG(){const na=+document.getElementById('agNa').value,cl=+document.getElementById('agCl').value,hco=+document.getElementById('agHco').value,alb=+document.getElementById('agAlb').value;if(!na||!cl||!hco)return;const ag=na-cl-hco;const corrAG=alb?ag+2.5*(4.0-alb):ag;let s='Normal',c='var(--accent)';if(corrAG>12){s='Elevated — HAGMA';c='var(--danger)';}document.getElementById('agR').innerHTML=`<div class="vital-box" style="text-align:center;margin-top:12px;"><div class="vital-label">Anion Gap</div><div class="vital-value" style="color:${c};font-size:32px;">${ag.toFixed(1)}</div><div style="font-size:14px;font-weight:600;color:${c};">${s}</div>${alb?`<div style="font-size:11px;color:var(--text-dim);">Albumin-corrected: ${corrAG.toFixed(1)}</div>`:''}</div>`;}

function openCalcFENa(){showModal(`<button class="modal-close" onclick="closeModal()">✕</button><h3>FENa — Fractional Excretion of Sodium</h3><div class="form-grid"><div class="form-group"><label>Urine Na (mEq/L)</label><input type="number" id="feUNa"></div><div class="form-group"><label>Serum Na (mEq/L)</label><input type="number" id="feSNa"></div><div class="form-group"><label>Urine Cr (mg/dL)</label><input type="number" step="0.1" id="feUCr"></div><div class="form-group"><label>Serum Cr (mg/dL)</label><input type="number" step="0.01" id="feSCr"></div></div><div class="form-actions"><button class="btn btn-primary" onclick="calcFENa()">Calculate</button></div><div id="feR"></div>`);}
function calcFENa(){const un=+document.getElementById('feUNa').value,sn=+document.getElementById('feSNa').value,uc=+document.getElementById('feUCr').value,sc=+document.getElementById('feSCr').value;if(!un||!sn||!uc||!sc)return;const fe=((un*sc)/(sn*uc)*100).toFixed(2);let s='Prerenal (volume responsive)',c='var(--accent)';if(fe>2){s='Intrinsic renal disease';c='var(--danger)';}else if(fe>=1){s='Indeterminate';c='var(--warning)';}document.getElementById('feR').innerHTML=`<div class="vital-box" style="text-align:center;margin-top:12px;"><div class="vital-label">FENa</div><div class="vital-value" style="color:${c};font-size:32px;">${fe}%</div><div style="font-size:14px;font-weight:600;color:${c};">${s}</div><div style="font-size:11px;color:var(--text-dim);">&lt;1% prerenal | 1-2% indeterminate | &gt;2% intrinsic</div></div>`;}

function openCalcFWD(){showModal(`<button class="modal-close" onclick="closeModal()">✕</button><h3>Free Water Deficit</h3><div class="form-grid"><div class="form-group"><label>Weight (kg)</label><input type="number" id="fwW"></div><div class="form-group"><label>Serum Na⁺ (mEq/L)</label><input type="number" id="fwNa"></div><div class="form-group"><label>Sex</label><select id="fwS"><option value="0.6">Male</option><option value="0.5">Female</option></select></div></div><div class="form-actions"><button class="btn btn-primary" onclick="calcFWD()">Calculate</button></div><div id="fwR"></div>`);}
function calcFWD(){const w=+document.getElementById('fwW').value,na=+document.getElementById('fwNa').value,tbw=+document.getElementById('fwS').value;if(!w||!na)return;const def=(tbw*w*((na/140)-1)).toFixed(1);document.getElementById('fwR').innerHTML=`<div class="vital-box" style="text-align:center;margin-top:12px;"><div class="vital-label">Free Water Deficit</div><div class="vital-value" style="color:var(--primary);font-size:32px;">${def} L</div><div style="font-size:11px;color:var(--text-dim);">Replace over 48-72 hours. Correct Na &lt;10 mEq/24hr.</div></div>`;}

function openCalcASCVD(){showModal(`<button class="modal-close" onclick="closeModal()">✕</button><h3>ASCVD Risk Calculator (10-Year)</h3>
  <div class="form-grid">
    <div class="form-group"><label>Age</label><input type="number" id="avA"></div>
    <div class="form-group"><label>Sex</label><select id="avS"><option value="M">Male</option><option value="F">Female</option></select></div>
    <div class="form-group"><label>Total Cholesterol</label><input type="number" id="avTC"></div>
    <div class="form-group"><label>HDL</label><input type="number" id="avHDL"></div>
    <div class="form-group"><label>Systolic BP</label><input type="number" id="avSBP"></div>
    <div class="form-group"><label>On BP Meds?</label><select id="avBPM"><option value="0">No</option><option value="1">Yes</option></select></div>
    <div class="form-group"><label>Diabetic?</label><select id="avDM"><option value="0">No</option><option value="1">Yes</option></select></div>
    <div class="form-group"><label>Current Smoker?</label><select id="avSmk"><option value="0">No</option><option value="1">Yes</option></select></div>
  </div><div class="form-actions"><button class="btn btn-primary" onclick="calcASCVD()">Calculate</button></div><div id="avR"></div>`);}
function calcASCVD(){
  // Simplified pooled cohort — approximate
  const a=+document.getElementById('avA').value,tc=+document.getElementById('avTC').value,hdl=+document.getElementById('avHDL').value,sbp=+document.getElementById('avSBP').value,bpm=+document.getElementById('avBPM').value,dm=+document.getElementById('avDM').value,smk=+document.getElementById('avSmk').value,sex=document.getElementById('avS').value;
  if(!a||!tc||!hdl||!sbp) return;
  // Rough estimation (proper PCE uses Cox model — this is illustrative)
  let risk=0;
  if(sex==='M'){risk=Math.max(0.5,Math.min(30,(a-20)*0.5+(tc>240?3:0)+(hdl<40?3:0)+(sbp>140?4:sbp>130?2:0)+(bpm?2:0)+(dm?4:0)+(smk?4:0)));}
  else{risk=Math.max(0.3,Math.min(25,(a-20)*0.4+(tc>240?2.5:0)+(hdl<50?2.5:0)+(sbp>140?3.5:sbp>130?1.5:0)+(bpm?1.5:0)+(dm?4:0)+(smk?3:0)));}
  risk=risk.toFixed(1);
  let s='Low risk',cl='var(--accent)';if(risk>=20){s='High risk — statin indicated';cl='var(--danger)';}else if(risk>=7.5){s='Intermediate-high — consider statin';cl='var(--warning)';}else if(risk>=5){s='Borderline — risk discussion';cl='var(--primary)';}
  document.getElementById('avR').innerHTML=`<div class="vital-box" style="text-align:center;margin-top:12px;"><div class="vital-label">10-Year ASCVD Risk</div><div class="vital-value" style="color:${cl};font-size:32px;">${risk}%</div><div style="font-size:14px;font-weight:600;color:${cl};">${s}</div><div style="font-size:11px;color:var(--text-dim);">⚠️ Simplified estimate. Use ACC/AHA Pooled Cohort calculator for clinical decisions.</div></div>`;
}

function calcCHA2(){const s=(document.getElementById('ch_c').checked?1:0)+(document.getElementById('ch_h').checked?1:0)+(document.getElementById('ch_a2').checked?2:0)+(document.getElementById('ch_d').checked?1:0)+(document.getElementById('ch_s2').checked?2:0)+(document.getElementById('ch_v').checked?1:0)+(document.getElementById('ch_a').checked?1:0)+(document.getElementById('ch_sc').checked?1:0);const annRisk=['0','1.3','2.2','3.2','4.0','6.7','9.8','9.6','6.7','15.2'];let rec='No anticoagulation needed',cl='var(--accent)';if(s>=2){rec='Anticoagulation recommended';cl='var(--danger)';}else if(s===1){rec='Consider anticoagulation';cl='var(--warning)';}document.getElementById('chR').innerHTML=`<div class="vital-box" style="text-align:center;margin-top:12px;"><div class="vital-label">CHA₂DS₂-VASc</div><div class="vital-value" style="color:${cl};font-size:32px;">${s}</div><div style="font-size:14px;font-weight:600;color:${cl};">${rec}</div><div style="font-size:11px;color:var(--text-dim);">Annual stroke risk: ~${annRisk[s]||'>15'}%</div></div>`;}

function openCalcFIB4(){showModal(`<button class="modal-close" onclick="closeModal()">✕</button><h3>FIB-4 Index — Liver Fibrosis</h3><div class="form-grid"><div class="form-group"><label>Age</label><input type="number" id="f4A"></div><div class="form-group"><label>AST (U/L)</label><input type="number" id="f4AST"></div><div class="form-group"><label>ALT (U/L)</label><input type="number" id="f4ALT"></div><div class="form-group"><label>Platelets (×10⁹/L)</label><input type="number" id="f4Plt"></div></div><div class="form-actions"><button class="btn btn-primary" onclick="calcFIB4()">Calculate</button></div><div id="f4R"></div>`);}
function calcFIB4(){const a=+document.getElementById('f4A').value,ast=+document.getElementById('f4AST').value,alt=+document.getElementById('f4ALT').value,plt=+document.getElementById('f4Plt').value;if(!a||!ast||!alt||!plt)return;const f=(a*ast/(plt*Math.sqrt(alt))).toFixed(2);let s='Low risk — advanced fibrosis unlikely',cl='var(--accent)';if(f>3.25){s='High risk — advanced fibrosis likely';cl='var(--danger)';}else if(f>=1.45){s='Indeterminate — consider further testing';cl='var(--warning)';}document.getElementById('f4R').innerHTML=`<div class="vital-box" style="text-align:center;margin-top:12px;"><div class="vital-label">FIB-4</div><div class="vital-value" style="color:${cl};font-size:32px;">${f}</div><div style="font-size:14px;font-weight:600;color:${cl};">${s}</div><div style="font-size:11px;color:var(--text-dim);">&lt;1.45 low | 1.45-3.25 indeterminate | &gt;3.25 high</div></div>`;}

function openCalcWinters(){showModal(`<button class="modal-close" onclick="closeModal()">✕</button><h3>Winters' Formula — Expected pCO₂</h3><div class="form-group"><label>HCO₃⁻ (mEq/L)</label><input type="number" id="wHco"></div><div class="form-actions"><button class="btn btn-primary" onclick="calcWinters()">Calculate</button></div><div id="wR"></div>`);}
function calcWinters(){const hco=+document.getElementById('wHco').value;if(!hco)return;const lo=(1.5*hco+8-2).toFixed(0);const hi=(1.5*hco+8+2).toFixed(0);document.getElementById('wR').innerHTML=`<div class="vital-box" style="text-align:center;margin-top:12px;"><div class="vital-label">Expected pCO₂</div><div class="vital-value" style="color:var(--primary);font-size:32px;">${lo} — ${hi} mmHg</div><div style="font-size:11px;color:var(--text-dim);">If measured pCO₂ is lower → concomitant respiratory alkalosis<br>If higher → concomitant respiratory acidosis</div></div>`;}

function openCalcCaCorr(){showModal(`<button class="modal-close" onclick="closeModal()">✕</button><h3>Calcium Correction for Albumin</h3><div class="form-grid"><div class="form-group"><label>Total Calcium (mg/dL)</label><input type="number" step="0.1" id="ccCa"></div><div class="form-group"><label>Albumin (g/dL)</label><input type="number" step="0.1" id="ccAlb"></div></div><div class="form-actions"><button class="btn btn-primary" onclick="calcCaCorr()">Calculate</button></div><div id="ccR"></div>`);}
function calcCaCorr(){const ca=+document.getElementById('ccCa').value,alb=+document.getElementById('ccAlb').value;if(!ca||!alb)return;const corr=(ca+0.8*(4.0-alb)).toFixed(1);let s='Normal',cl='var(--accent)';if(corr>10.5){s='Hypercalcemia';cl='var(--danger)';}else if(corr<8.5){s='Hypocalcemia';cl='var(--warning)';}document.getElementById('ccR').innerHTML=`<div class="vital-box" style="text-align:center;margin-top:12px;"><div class="vital-label">Corrected Ca²⁺</div><div class="vital-value" style="color:${cl};font-size:32px;">${corr} mg/dL</div><div style="font-size:14px;font-weight:600;color:${cl};">${s}</div><div style="font-size:11px;color:var(--text-dim);">Normal: 8.5–10.5 mg/dL</div></div>`;}

function renderNotesList(filter) {
  let notes = [...db.encounters].sort((a, b) => b.date.localeCompare(a.date));
  if (filter !== 'all') {
    notes = notes.filter(e => e.status === filter);
  }
  
  if (!notes.length) {
    return '<div class="empty-state"><div class="empty-icon">📝</div><p>No notes found</p></div>';
  }
  
  return notes.map(e => {
    const p = db.patients.find(x => x.id === e.patientId);

// Toggle collapsible sections (eClinicalWorks style)
function toggleCollapsible(header) {
  const content = header.nextElementSibling;
  if (content && content.classList.contains('collapsible-content')) {
    const isHidden = content.style.display === 'none';
    content.style.display = isHidden ? 'block' : 'none';
    // Update arrow
    if (header.innerHTML.includes('▼')) {
      header.innerHTML = header.innerHTML.replace('▼', '▶');
    } else {
      header.innerHTML = header.innerHTML.replace('▶', '▼');
    }
  }
}

// ICD-10 search
function searchICD10(query) {
  const results = document.getElementById('icdResults');
  if (!query || query.length < 2) {
    results.innerHTML = '';
    return;
  }
  const q = query.toLowerCase();
  const matches = COMMON_ICD10.filter(i => 
    i.code.toLowerCase().includes(q) || i.desc.toLowerCase().includes(q)
  ).slice(0, 8);
  
  results.innerHTML = matches.map(m => `
    <div style="padding:4px;cursor:pointer;border-bottom:1px solid var(--border);" 
         onclick="document.getElementById('tmplICDCustom').value='${m.code}';document.getElementById('icdResults').innerHTML='';">
      <strong>${m.code}</strong> — ${m.desc}
    </div>
  `).join('') || '<div style="padding:4px;color:var(--text-dim);">No matches</div>';
}

// Save note from template
function saveTemplateNote(status, templateKey) {
  const pat = db.patients.find(p => p.id === document.getElementById('tmplPatient').value);
  const hpi = document.getElementById('tmplHPI').value;
  const ros = document.getElementById('tmplROS').value;
  const addlSubj = document.getElementById('tmplSubj').value;
  const exam = document.getElementById('tmplExam').value;
  const addlObj = document.getElementById('tmplObj').value;
  
  const encounter = {
    id: genId(),
    patientId: document.getElementById('tmplPatient').value,
    providerId: document.getElementById('tmplProvider').value,
    practiceId: pat ? pat.practiceId : db.practices[0].id,
    date: document.getElementById('tmplDate').value,
    type: document.getElementById('tmplEncType').value,
    noteType: NOTE_TEMPLATES[templateKey].name,
    templateUsed: templateKey,
    chiefComplaint: document.getElementById('tmplCC').value,
    // Combine HPI, ROS, and additional subjective
    subjective: `HPI:\n${hpi}\n\nROS:\n${ros}${addlSubj ? '\n\nAdditional:\n' + addlSubj : ''}`,
    // Combine exam and additional objective
    objective: `Physical Examination:\n${exam}${addlObj ? '\n\nAdditional:\n' + addlObj : ''}`,
    assessment: document.getElementById('tmplAssess').value,
    plan: document.getElementById('tmplPlan').value + (document.getElementById('tmplFollowup').value ? '\n\nFollow-up: ' + document.getElementById('tmplFollowup').value : ''),
    vitals: {
      bp: document.getElementById('tmplBP').value,
      hr: document.getElementById('tmplHR').value,
      temp: document.getElementById('tmplTemp').value,
      spo2: document.getElementById('tmplO2').value,
      weight: document.getElementById('tmplWt').value,
      height: document.getElementById('tmplHt').value
    },
    icd10: document.getElementById('tmplICDCustom').value || document.getElementById('tmplICD').value,
    cpt: document.getElementById('tmplCPT').value,
    status: status,
    createdAt: new Date().toISOString(),
    signedAt: status === 'signed' ? new Date().toISOString() : null,
    lockedAt: status === 'signed' ? new Date().toISOString() : null
  };
  
  if (!encounter.chiefComplaint) {
    alert('Chief complaint is required');
    return;
  }
  
  db.encounters.push(encounter);
  saveDB();
  closeModal();
  navigate('notes');
}

function saveAmendment(id) {
  const enc = db.encounters.find(e => e.id === id);
  if (!enc) return;
  
  const text = document.getElementById('amendmentText').value;
  const reason = document.getElementById('amendmentReason').value;
  
  if (!text.trim()) {
    alert('Amendment text is required');
    return;
  }
  
  if (!enc.amendments) enc.amendments = [];
  
  const pv = db.providers.find(x => x.id === enc.providerId);
  
  enc.amendments.push({
    id: genId(),
    date: new Date().toISOString(),
    provider: pv ? pv.name : 'Unknown',
    reason: reason,
    text: text
  });
  
  saveDB();
  closeModal();
  openSOAPNoteDetail(id);
}

function toggleAllBulkNotes(checked) {
  document.querySelectorAll('.bulk-note-check').forEach(cb => cb.checked = checked);

function executeBulkSign() {
  const checked = document.querySelectorAll('.bulk-note-check:checked');
  const ids = Array.from(checked).map(cb => cb.value);
  
  if (!ids.length) {
    alert('Select at least one note to sign');
    return;
  }
  
  ids.forEach(id => {
    const enc = db.encounters.find(e => e.id === id);

      enc.status = 'signed';
      enc.signedAt = new Date().toISOString();

  saveDB();
  closeModal();
  navigate('notes');

}

// SCHEDULING MODULE
// ═══════════════════════════════════════════
let scheduleView = 'day'; // day, week, month
let scheduleDate = new Date();
let scheduleTab = 'calendar'; // calendar, flow

function renderScheduling(c) {
  setPageTitle('Scheduling');
  const tabs = `<div class="tabs" style="margin-bottom:16px;">
    <div class="tab ${scheduleTab==='calendar'?'active':''}" onclick="scheduleTab='calendar';render()">📅 Calendar</div>
    <div class="tab ${scheduleTab==='flow'?'active':''}" onclick="scheduleTab='flow';render()">🏥 Patient Flow Board</div>
  </div>`;
  
  if (scheduleTab === 'flow') {
    c.innerHTML = tabs + renderFlowBoard();
  } else {
    c.innerHTML = tabs + renderCalendarView();
  }
}

function renderCalendarView() {
  const dateStr = formatDateTitle(scheduleDate, scheduleView);
  
  let html = `
    <div class="calendar-header">
      <div class="calendar-nav">
        <button onclick="navSchedule(-1)">◀</button>
        <button onclick="goToday()">Today</button>
        <button onclick="navSchedule(1)">▶</button>
      </div>
      <div class="calendar-title">${dateStr}</div>
      <div class="view-toggle">
        <button class="${scheduleView==='day'?'active':''}" onclick="setView('day')">Day</button>
        <button class="${scheduleView==='week'?'active':''}" onclick="setView('week')">Week</button>
        <button class="${scheduleView==='month'?'active':''}" onclick="setView('month')">Month</button>
      </div>
      <div class="spacer"></div>
      <button class="btn btn-primary" onclick="showNewAppointmentModal()">+ New Appointment</button>
    </div>
    <div class="legend">
      <div class="legend-item"><div class="legend-dot" style="background:#0EA5E9;"></div>New Patient (60m)</div>
      <div class="legend-item"><div class="legend-dot" style="background:#10B981;"></div>Follow-up (30m)</div>
      <div class="legend-item"><div class="legend-dot" style="background:#8B5CF6;"></div>Procedure</div>
      <div class="legend-item"><div class="legend-dot" style="background:#F59E0B;"></div>Telehealth</div>
      <div class="legend-item"><div class="legend-dot" style="background:#EF4444;"></div>Walk-in (15m)</div>
    </div>`;
  
  if (scheduleView === 'month') {
    html += renderMonthView();
  } else {
    html += renderDayWeekView();
  }
  
  return html;
}

function formatDateTitle(date, view) {
  const months = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  const days = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  
  if (view === 'day') {
    return `${days[date.getDay()]}, ${months[date.getMonth()]} ${date.getDate()}, ${date.getFullYear()}`;
  } else if (view === 'week') {
    const start = new Date(date);
    start.setDate(date.getDate() - date.getDay());
    const end = new Date(start);
    end.setDate(start.getDate() + 6);
    return `${months[start.getMonth()]} ${start.getDate()} - ${start.getMonth()===end.getMonth()?'':months[end.getMonth()]+' '}${end.getDate()}, ${end.getFullYear()}`;
  } else {
    return `${months[date.getMonth()]} ${date.getFullYear()}`;
  }
}

function navSchedule(dir) {
  if (scheduleView === 'day') {
    scheduleDate.setDate(scheduleDate.getDate() + dir);
  } else if (scheduleView === 'week') {
    scheduleDate.setDate(scheduleDate.getDate() + (dir * 7));
  } else {
    scheduleDate.setMonth(scheduleDate.getMonth() + dir);
  }
  render();
}

function goToday() {
  scheduleDate = new Date();
  render();
}

function setView(v) {
  scheduleView = v;
  render();
}

function renderDayWeekView() {
  const days = scheduleView === 'day' ? [new Date(scheduleDate)] : getWeekDays(scheduleDate);
  const hours = [];
  for (let h = 7; h <= 19; h++) {
    hours.push(h);
  }
  
  const today = new Date().toISOString().split('T')[0];
  
  let html = `<div class="calendar-grid" style="display:flex;">
    <div class="calendar-time-col">
      <div class="calendar-day-header" style="height:52px;"></div>`;
  
  hours.forEach(h => {
    const ampm = h >= 12 ? 'PM' : 'AM';
    const hr = h > 12 ? h - 12 : h;
    html += `<div class="calendar-time-slot">${hr}:00 ${ampm}</div>`;
  });
  
  html += `</div>`;
  
  days.forEach(day => {
    const dayStr = day.toISOString().split('T')[0];
    const isToday = dayStr === today;
    const dayAppts = db.appointments.filter(a => a.date === dayStr);
    const daysArr = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
    
    html += `<div class="calendar-day-col">
      <div class="calendar-day-header ${isToday?'today':''}">
        <div>${daysArr[day.getDay()]}</div>
        <div class="date-num">${day.getDate()}</div>
      </div>
      <div class="calendar-slots" style="position:relative;">`;
    
    // Render time slots
    hours.forEach((h, idx) => {
      html += `<div class="calendar-slot" onclick="showNewAppointmentModal('${dayStr}','${h}:00')"></div>`;
    });
    
    // Render appointments on top
    dayAppts.forEach(appt => {
      const [apptH, apptM] = appt.time.split(':').map(Number);
      const startSlot = apptH - 7;
      const top = startSlot * 48 + (apptM / 60 * 48);
      const height = (appt.duration / 60) * 48 - 2;
      const patient = db.patients.find(p => p.id === appt.patientId);
      const provider = db.providers.find(p => p.id === appt.providerId);
      
      html += `<div class="appt-block type-${appt.type}" style="top:${top}px;height:${height}px;" onclick="event.stopPropagation();openAppointmentDetail('${appt.id}')">
        <div class="appt-time">${formatTime(appt.time)} - ${formatTime(addMinutes(appt.time, appt.duration))}</div>
        <div class="appt-patient">${patient ? patient.firstName + ' ' + patient.lastName : 'Unknown'}</div>
        ${height > 40 ? `<div class="appt-provider">${provider ? provider.name : ''}</div>` : ''}
        ${height > 55 ? `<div class="appt-status">${appt.status}</div>` : ''}
      </div>`;
    });
    
    html += `</div></div>`;
  });
  
  html += `</div>`;
  return html;
}

function renderMonthView() {
  const year = scheduleDate.getFullYear();
  const month = scheduleDate.getMonth();
  const firstDay = new Date(year, month, 1);
  const lastDay = new Date(year, month + 1, 0);
  const startDate = new Date(firstDay);
  startDate.setDate(startDate.getDate() - firstDay.getDay());
  
  const today = new Date().toISOString().split('T')[0];
  const daysArr = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  
  let html = `<div class="month-grid">`;
  
  // Headers
  daysArr.forEach(d => {
    html += `<div class="month-day-header">${d}</div>`;
  });
  
  // Days
  const current = new Date(startDate);
  for (let i = 0; i < 42; i++) {
    const dayStr = current.toISOString().split('T')[0];
    const isOther = current.getMonth() !== month;
    const isToday = dayStr === today;
    const dayAppts = db.appointments.filter(a => a.date === dayStr);
    
    html += `<div class="month-day ${isOther?'other-month':''} ${isToday?'today':''}" onclick="scheduleDate=new Date('${dayStr}');scheduleView='day';render()">
      <div class="day-num">${current.getDate()}</div>`;
    
    dayAppts.slice(0, 3).forEach(appt => {
      const patient = db.patients.find(p => p.id === appt.patientId);
      html += `<div class="month-appt type-${appt.type}" onclick="event.stopPropagation();openAppointmentDetail('${appt.id}')">${formatTime(appt.time)} ${patient ? patient.lastName : ''}</div>`;
    });
    
    if (dayAppts.length > 3) {
      html += `<div class="month-more">+${dayAppts.length - 3} more</div>`;
    }
    
    html += `</div>`;
    current.setDate(current.getDate() + 1);
  }
  
  html += `</div>`;
  return html;
}

function getWeekDays(date) {
  const days = [];
  const start = new Date(date);
  start.setDate(date.getDate() - date.getDay());
  for (let i = 0; i < 7; i++) {
    days.push(new Date(start));
    start.setDate(start.getDate() + 1);
  }
  return days;
}

function formatTime(timeStr) {
  if (!timeStr) return '';
  const [h, m] = timeStr.split(':').map(Number);
  const ampm = h >= 12 ? 'PM' : 'AM';
  const hr = h > 12 ? h - 12 : (h === 0 ? 12 : h);
  return `${hr}:${m.toString().padStart(2,'0')} ${ampm}`;
}

function addMinutes(timeStr, minutes) {
  const [h, m] = timeStr.split(':').map(Number);
  const totalMins = h * 60 + m + minutes;
  const newH = Math.floor(totalMins / 60);
  const newM = totalMins % 60;
  return `${newH}:${newM.toString().padStart(2,'0')}`;
}

function renderFlowCard(appt, stage) {
  const patient = db.patients.find(p => p.id === appt.patientId);
  const provider = db.providers.find(p => p.id === appt.providerId);
  const waitTime = calcWaitTime(appt, stage);
  const waitClass = waitTime < 10 ? 'short' : waitTime < 20 ? 'medium' : 'long';
  
  return `<div class="flow-card" onclick="openAppointmentDetail('${appt.id}')">
    <div class="flow-patient">${patient ? patient.firstName + ' ' + patient.lastName : 'Unknown'}</div>
    <div class="flow-time">${formatTime(appt.time)} · ${appt.type}</div>
    <div class="flow-provider">${provider ? provider.name : ''}</div>
    <div class="flow-reason">${appt.reason || ''}</div>
    <div class="flow-wait ${waitClass}">${waitTime} min ${stage === 'checkin' ? 'waiting' : stage === 'roomed' ? 'roomed' : 'with provider'}</div>
    ${appt.room ? `<div style="font-size:10px;color:var(--primary);margin-top:2px;">📍 ${appt.room}</div>` : ''}
  </div>`;
}

function calcWaitTime(appt, stage) {
  const now = Date.now();
  let startTime;
  if (stage === 'checkin' && appt.checkinTime) {
    startTime = new Date(appt.checkinTime).getTime();
  } else if (stage === 'roomed' && appt.roomedTime) {
    startTime = new Date(appt.roomedTime).getTime();
  } else if (stage === 'provider' && appt.providerTime) {
    startTime = new Date(appt.providerTime).getTime();
  } else {
    return 0;
  }
  return Math.round((now - startTime) / 60000);
}

function getPatientName(patientId) {
  if (!patientId) return '';
  const p = db.patients.find(x => x.id === patientId);
  return p ? p.firstName + ' ' + p.lastName : '';
}

// ═══════ APPOINTMENT ACTIONS ═══════
function checkInPatient(apptId) {
  const appt = db.appointments.find(a => a.id === apptId);
  if (appt) {
    appt.status = 'checked-in';
    appt.checkinTime = new Date().toISOString();
    saveDB();
    render();
  }
}

function roomPatient(apptId) {
  const appt = db.appointments.find(a => a.id === apptId);
  if (appt) {
    // Find available room
    const rooms = db.rooms.filter(r => r.status === 'available' && r.practiceId === appt.practiceId);
    if (rooms.length === 0) {
      const anyRoom = db.rooms.find(r => r.status === 'available');
      if (anyRoom) {
        appt.room = anyRoom.name;
        anyRoom.status = 'occupied';
        anyRoom.currentPatientId = appt.patientId;
      } else {
        alert('No rooms available');
        return;
      }
    } else {
      appt.room = rooms[0].name;
      rooms[0].status = 'occupied';
      rooms[0].currentPatientId = appt.patientId;
    }
    appt.status = 'roomed';
    appt.roomedTime = new Date().toISOString();
    saveDB();
    render();
  }
}

function startWithProvider(apptId) {
  const appt = db.appointments.find(a => a.id === apptId);
  if (appt) {
    appt.status = 'in-room';
    appt.providerTime = new Date().toISOString();
    saveDB();
    render();
  }
}

function readyForCheckout(apptId) {
  const appt = db.appointments.find(a => a.id === apptId);
  if (appt) {
    appt.status = 'checkout';
    // Free up room
    const room = db.rooms.find(r => r.name === appt.room);
    if (room) {
      room.status = 'cleaning';
      room.currentPatientId = null;
      setTimeout(() => {
        room.status = 'available';
        saveDB();
        render();
      }, 30000); // 30 sec for demo, normally longer
    }
    saveDB();
    render();
  }
}

function completeVisit(apptId) {
  const appt = db.appointments.find(a => a.id === apptId);
  if (appt) {
    appt.status = 'completed';
    appt.checkoutTime = new Date().toISOString();
    saveDB();
    render();
  }
}

function markNoShow(apptId) {
  const appt = db.appointments.find(a => a.id === apptId);
  if (appt) {
    appt.status = 'no-show';
    saveDB();
    render();
  }
}

function cancelAppointment(apptId) {
  const appt = db.appointments.find(a => a.id === apptId);
  if (appt && confirm('Cancel this appointment?')) {
    appt.status = 'cancelled';

    render();
  }
}

async function initCamera() {
  const video = document.getElementById('cameraVideo');
  const loading = document.getElementById('cameraLoading');
  const error = document.getElementById('cameraError');
  const errorText = document.getElementById('cameraErrorText');
  
  try {
    // First enumerate devices
    const devices = await navigator.mediaDevices.enumerateDevices();
    cameraState.devices = devices.filter(d => d.kind === 'videoinput');
    
    // Populate device selector
    const select = document.getElementById('cameraDeviceSelect');
    if (cameraState.devices.length === 0) {
      throw new Error('No cameras found');
    }
    
    select.innerHTML = cameraState.devices.map((d, i) => {
      const label = d.label || `Camera ${i + 1}`;
      // Detect front/back camera
      const isBack = label.toLowerCase().includes('back') || label.toLowerCase().includes('rear');
      const isFront = label.toLowerCase().includes('front') || label.toLowerCase().includes('user');
      const icon = isBack ? '📹' : isFront ? '🤳' : '📷';
      return `<option value="${d.deviceId}">${icon} ${label}</option>`;
    }).join('');
    
    // Default to front camera on mobile, any camera on desktop
    const frontCam = cameraState.devices.find(d => 
      d.label.toLowerCase().includes('front') || d.label.toLowerCase().includes('user')
    );
    const backCam = cameraState.devices.find(d => 
      d.label.toLowerCase().includes('back') || d.label.toLowerCase().includes('rear')
    );
    
    const defaultDevice = frontCam || cameraState.devices[0];
    cameraState.currentDeviceId = defaultDevice.deviceId;
    cameraState.isFrontCamera = !backCam || defaultDevice === frontCam;
    select.value = cameraState.currentDeviceId;
    
    // Start stream
    await startCameraStream();
    
    loading.style.display = 'none';
    updateMirrorState();
    
  } catch (err) {
    console.error('Camera init error:', err);
    loading.style.display = 'none';
    error.style.display = 'block';
    
    if (err.name === 'NotAllowedError' || err.name === 'PermissionDeniedError') {
      errorText.textContent = 'Camera access denied. Please allow camera access in your browser settings.';
    } else if (err.name === 'NotFoundError') {
      errorText.textContent = 'No camera found on this device.';
    } else if (err.name === 'NotReadableError') {
      errorText.textContent = 'Camera is in use by another application.';
    } else {
      errorText.textContent = err.message || 'Failed to access camera.';
    }
  }
}

async function startCameraStream() {
  const video = document.getElementById('cameraVideo');
  
  // Stop existing stream
  if (cameraState.stream) {
    cameraState.stream.getTracks().forEach(t => t.stop());
  }
  
  const res = resolutionPresets[cameraState.resolution];
  
  const constraints = {
    video: {
      deviceId: cameraState.currentDeviceId ? { exact: cameraState.currentDeviceId } : undefined,
      width: { ideal: res.width },
      height: { ideal: res.height },
      facingMode: cameraState.isFrontCamera ? 'user' : 'environment'
    },
    audio: false
  };
  
  cameraState.stream = await navigator.mediaDevices.getUserMedia(constraints);
  video.srcObject = cameraState.stream;
  
  // Check for torch/flash capability
  const track = cameraState.stream.getVideoTracks()[0];
  const capabilities = track.getCapabilities ? track.getCapabilities() : {};
  cameraState.flashSupported = capabilities.torch === true;
  
  const flashBtn = document.getElementById('flashToggleBtn');
  if (flashBtn) {
    flashBtn.style.display = cameraState.flashSupported ? 'flex' : 'none';
  }
}

function stopCamera() {
  if (cameraState.stream) {
    cameraState.stream.getTracks().forEach(t => t.stop());
    cameraState.stream = null;
  }
}

async function switchCamera(deviceId) {
  cameraState.currentDeviceId = deviceId;
  
  // Detect if front camera
  const device = cameraState.devices.find(d => d.deviceId === deviceId);
  if (device) {
    const label = device.label.toLowerCase();
    cameraState.isFrontCamera = label.includes('front') || label.includes('user') || 
                                (!label.includes('back') && !label.includes('rear'));
  }
  
  await startCameraStream();
  updateMirrorState();
}

async function switchCameraDirection() {
  // Toggle between front and back camera
  const frontCam = cameraState.devices.find(d => 
    d.label.toLowerCase().includes('front') || d.label.toLowerCase().includes('user')
  );
  const backCam = cameraState.devices.find(d => 
    d.label.toLowerCase().includes('back') || d.label.toLowerCase().includes('rear')
  );
  
  if (frontCam && backCam) {
    const newDevice = cameraState.isFrontCamera ? backCam : frontCam;
    cameraState.currentDeviceId = newDevice.deviceId;
    cameraState.isFrontCamera = !cameraState.isFrontCamera;
    
    const select = document.getElementById('cameraDeviceSelect');
    if (select) select.value = newDevice.deviceId;
    
    await startCameraStream();
    updateMirrorState();
  }
}

async function changeResolution(res) {
  cameraState.resolution = res;
  await startCameraStream();
}

function toggleMirror() {
  cameraState.isMirrored = !cameraState.isMirrored;
  updateMirrorState();
}

function updateMirrorState() {
  const video = document.getElementById('cameraVideo');
  const btn = document.getElementById('mirrorToggleBtn');
  
  // Auto-mirror front camera
  const shouldMirror = cameraState.isFrontCamera && cameraState.isMirrored;
  
  if (video) {
    video.classList.toggle('mirror', shouldMirror);
  }
  if (btn) {
    btn.classList.toggle('active', cameraState.isMirrored);
  }
}

async function toggleFlash() {
  if (!cameraState.flashSupported || !cameraState.stream) return;
  
  cameraState.flashEnabled = !cameraState.flashEnabled;
  const track = cameraState.stream.getVideoTracks()[0];
  
  try {
    await track.applyConstraints({
      advanced: [{ torch: cameraState.flashEnabled }]
    });
    
    const btn = document.getElementById('flashToggleBtn');
    if (btn) btn.classList.toggle('active', cameraState.flashEnabled);
  } catch (e) {
    console.warn('Flash toggle failed:', e);
  }
}

function capturePhoto() {
  const video = document.getElementById('cameraVideo');
  const canvas = document.getElementById('cameraCanvas');
  const preview = document.getElementById('capturedPreview');
  const btn = document.getElementById('captureBtn');
  
  // Animate button
  btn.classList.add('capturing');
  setTimeout(() => btn.classList.remove('capturing'), 300);
  
  // Set canvas size to video size
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  
  const ctx = canvas.getContext('2d');
  
  // If mirrored, flip the capture
  if (cameraState.isFrontCamera && cameraState.isMirrored) {
    ctx.translate(canvas.width, 0);
    ctx.scale(-1, 1);
  }
  
  ctx.drawImage(video, 0, 0);
  
  // Reset transform
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  
  // Get data URL
  cameraState.capturedImage = canvas.toDataURL('image/jpeg', 0.92);
  cameraState.rotation = 0;
  
  // Show preview
  preview.src = cameraState.capturedImage;
  preview.style.display = 'block';
  video.style.display = 'none';
  
  // Switch to review mode
  document.getElementById('cameraSettings').style.display = 'none';
  document.getElementById('captureControls').style.display = 'none';
  document.getElementById('reviewControls').style.display = 'flex';
  document.getElementById('imageEditControls').style.display = 'flex';
  
  // Stop camera to save battery
  stopCamera();
}

function retakePhoto() {
  cameraState.capturedImage = null;
  cameraState.rotation = 0;
  
  const video = document.getElementById('cameraVideo');
  const preview = document.getElementById('capturedPreview');
  
  preview.style.display = 'none';
  video.style.display = 'block';
  
  document.getElementById('cameraSettings').style.display = 'flex';
  document.getElementById('captureControls').style.display = 'flex';
  document.getElementById('reviewControls').style.display = 'none';
  document.getElementById('imageEditControls').style.display = 'none';
  
  // Restart camera
  initCamera();
}

function rotateImage(degrees) {
  if (!cameraState.capturedImage) return;
  
  cameraState.rotation = (cameraState.rotation + degrees) % 360;
  if (cameraState.rotation < 0) cameraState.rotation += 360;
  
  const canvas = document.createElement('canvas');
  const ctx = canvas.getContext('2d');
  const img = new Image();
  
  img.onload = () => {
    // Swap dimensions for 90/270 rotation
    if (cameraState.rotation === 90 || cameraState.rotation === 270) {
      canvas.width = img.height;
      canvas.height = img.width;
    } else {
      canvas.width = img.width;
      canvas.height = img.height;
    }
    
    ctx.translate(canvas.width / 2, canvas.height / 2);
    ctx.rotate((cameraState.rotation * Math.PI) / 180);
    ctx.drawImage(img, -img.width / 2, -img.height / 2);
    
    const preview = document.getElementById('capturedPreview');
    preview.src = canvas.toDataURL('image/jpeg', 0.92);
  };
  
  // Load from original (not the preview) to avoid quality loss
  img.src = cameraState.capturedImage;
}

function toggleCapturedMirror() {
  if (!cameraState.capturedImage) return;
  
  const preview = document.getElementById('capturedPreview');
  const canvas = document.createElement('canvas');
  const ctx = canvas.getContext('2d');
  const img = new Image();
  
  img.onload = () => {
    canvas.width = img.width;
    canvas.height = img.height;
    ctx.translate(canvas.width, 0);
    ctx.scale(-1, 1);
    ctx.drawImage(img, 0, 0);
    
    const newData = canvas.toDataURL('image/jpeg', 0.92);
    cameraState.capturedImage = newData;
    preview.src = newData;
  };
  
  img.src = preview.src;
}

function acceptPhoto() {
  if (!cameraState.capturedImage) return;
  
  // Get the final image from preview (includes rotation)
  const preview = document.getElementById('capturedPreview');
  const finalImage = preview.src;
  
  closeCameraCapture();
  saveCapturedPhoto(finalImage);
}

function saveCapturedPhoto(dataUrl) {
  const { targetPatientId, targetPhotoType, targetEncounterId, onCaptureCallback } = cameraState;
  
  if (onCaptureCallback) {
    onCaptureCallback(dataUrl);
    return;
  }
  
  if (targetEncounterId && targetPhotoType === 'clinical') {
    // Save to encounter clinical photos
    const enc = db.encounters.find(e => e.id === targetEncounterId);
    if (enc) {
      if (!enc.clinicalPhotos) enc.clinicalPhotos = [];
      const label = prompt('Photo label (optional):', 'Clinical photo');
      enc.clinicalPhotos.push({
        url: dataUrl,
        label: label || 'Clinical photo',
        capturedAt: new Date().toISOString()
      });
      saveDB();
      render();
    }
    return;
  }
  
  if (!targetPatientId) return;
  
  const p = db.patients.find(x => x.id === targetPatientId);
  if (!p) return;
  
  switch(targetPhotoType) {
    case 'profile': p.profilePhoto = dataUrl; break;
    case 'id': p.idDocument = dataUrl; break;
    case 'insuranceFront': p.insuranceCardFront = dataUrl; break;
    case 'insuranceBack': p.insuranceCardBack = dataUrl; break;
    case 'insuranceSecondaryFront': p.insuranceSecondaryCardFront = dataUrl; break;
    case 'insuranceSecondaryBack': p.insuranceSecondaryCardBack = dataUrl; break;
    case 'additional':
      if (!p.additionalDocuments) p.additionalDocuments = [];
      const name = prompt('Document name (optional):', 'Document');
      p.additionalDocuments.push({ url: dataUrl, name: name || 'Document', uploadedAt: new Date().toISOString() });
      break;
  }
  
  p.updatedAt = new Date().toISOString();
  saveDB();
  if (selectedPatient && selectedPatient.id === targetPatientId) selectedPatient = p;
  render();
}

// Override the original uploadPatientPhoto to use capture options
function uploadPatientPhoto(patientId, photoType) {
  showCaptureOptions(patientId, photoType);
}

// Add clinical photo to encounter
function addClinicalPhoto(encounterId) {
  showCaptureOptions(null, 'clinical', encounterId);
}

function deleteClinicalPhoto(encounterId, index) {
  if (!confirm('Delete this clinical photo?')) return;
  const enc = db.encounters.find(e => e.id === encounterId);
  if (!enc || !enc.clinicalPhotos) return;
  enc.clinicalPhotos.splice(index, 1);
  saveDB();
  render();
}

loadDB();
render();
</script>
